<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>관리자 - IVF 간사 규정집 개정안 투표</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f4;--card:#fff;--tx:#1f2a23;--mu:#5b6a60;--g:#2d6a45;--gl:#eaf0eb;--bd:#cfdad2;--p:#b4506a;--pl:#fbe9ee;--i:#7a6a2e;--il:#faf6e6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1c241f;--tx:#e8efe9;--mu:#9fb0a5;--g:#6fbf8e;--gl:#24342a;--bd:#33463a;--p:#e58aa0;--pl:#3a2530;--i:#d9c878;--il:#38341f}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:22px;color:var(--g);margin:8px 0 4px}.sub{color:var(--mu);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--g);padding:24px;border-radius:4px}
.step{font-size:13px;color:var(--mu);margin-bottom:8px}.q{font-size:18px;font-weight:700;margin:0 0 16px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input[type=text]{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--bd);border-radius:4px;cursor:pointer;font-weight:700}
.opt input{width:20px;height:20px}.opt.on{border-color:var(--g);background:var(--gl)}.opt.no.on{border-color:var(--p);background:var(--pl)}.opt.ab.on{border-color:var(--i);background:var(--il)}
.row{display:flex;gap:10px;margin-top:24px}
button{flex:1;padding:14px;font:inherit;font-weight:700;border-radius:4px;border:2px solid var(--g);cursor:pointer}
.pri{background:var(--g);color:#fff}.sec{background:transparent;color:var(--g)}button:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--p);font-size:14px;margin-top:12px;min-height:20px}.sum{font-size:15px}.sum b{color:var(--g)}
.done{text-align:center;padding:24px 0}.done .ck{font-size:48px}
</style></head><body><div class="w">
<h1>관리자 페이지</h1><p class="sub">IVF 간사 규정집 개정안 투표</p><div class="card" id="c"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const AG=["안건 1","안건 2","안건 3"],OP=["찬성","반대","기권"];
const c=document.getElementById("c");let key="";
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function login(msg){
 c.innerHTML='<p class="q">관리자 비밀번호를 입력해 주세요.</p><input type="password" id="k" style="width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)"><div class="err">'+(msg||"")+'</div><div class="row"><button class="pri" id="go">확인</button></div>';
 const go=()=>{key=document.getElementById("k").value;load()};
 document.getElementById("go").onclick=go;document.getElementById("k").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function load(){
 let rows;
 try{const r=await fetch("/api/results?key="+encodeURIComponent(key));if(!r.ok){login("비밀번호가 올바르지 않습니다.");return}rows=(await r.json()).sort((a,b)=>a.at-b.at)}
 catch(e){login("불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");return}
 const th="padding:8px;border:1px solid var(--bd);text-align:center",cnt=(k,l)=>rows.filter(x=>x[k]===l).length;
 c.innerHTML='<p class="q">투표 QR 코드</p><div id="qr" style="display:flex;justify-content:center;padding:16px;background:#fff"></div><p style="font-size:13px;color:var(--mu);word-break:break-all;text-align:center">'+location.origin+'/</p>'
 +'<p class="q" style="margin-top:20px">결과표 (총 '+rows.length+'명 참여)</p><table style="width:100%;border-collapse:collapse;font-size:15px"><tr style="background:var(--gl)"><th style="'+th+'">안건</th>'+OP.map(l=>'<th style="'+th+'">'+l+'</th>').join("")+'</tr>'+AG.map((a,i)=>'<tr><td style="'+th+'">'+a+'</td>'+OP.map(l=>'<td style="'+th+'">'+cnt("a"+(i+1),l)+'</td>').join("")+'</tr>').join("")+'</table>'
 +'<p class="q" style="margin-top:20px">투표자 명단</p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:var(--gl)"><th style="'+th+'">소속 지방회</th><th style="'+th+'">이름</th><th style="'+th+'">안건 1</th><th style="'+th+'">안건 2</th><th style="'+th+'">안건 3</th></tr>'+rows.map(x=>'<tr><td style="'+th+'">'+esc(x.region)+'</td><td style="'+th+'">'+esc(x.name)+'</td><td style="'+th+'">'+x.a1+'</td><td style="'+th+'">'+x.a2+'</td><td style="'+th+'">'+x.a3+'</td></tr>').join("")+'</table>'
 +'<div class="row"><button class="pri" id="rf">새로고침</button><button class="sec" id="rz" style="border-color:var(--p);color:var(--p)">모든 투표 삭제</button></div><div class="err" id="m"></div>';
 try{new QRCode(document.getElementById("qr"),{text:location.origin+"/",width:240,height:240})}catch(e){}
 document.getElementById("rf").onclick=load;
 document.getElementById("rz").onclick=async()=>{
  if(prompt("모든 투표와 중복투표 기록이 삭제되며 되돌릴 수 없습니다. 계속하려면 삭제 를 입력하세요.")!=="삭제")return;
  const q=await fetch("/api/reset?key="+encodeURIComponent(key),{method:"POST"});
  if(q.ok)load();else document.getElementById("m").textContent="삭제하지 못했습니다.";
 };
}
login();
</script></body></html>
