<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IVF 간사 규정집 개정안 투표</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f4;--card:#fff;--tx:#1f2a23;--mu:#5b6a60;--g:#2d6a45;--gl:#eaf0eb;--bd:#cfdad2;--p:#b4506a;--pl:#fbe9ee;--i:#7a6a2e;--il:#faf6e6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1c241f;--tx:#e8efe9;--mu:#9fb0a5;--g:#6fbf8e;--gl:#24342a;--bd:#33463a;--p:#e58aa0;--pl:#3a2530;--i:#d9c878;--il:#38341f}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:22px;color:var(--g);margin:8px 0 4px}.sub{color:var(--mu);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--g);padding:24px;border-radius:4px}
.step{font-size:13px;color:var(--mu);margin-bottom:8px}.q{font-size:18px;font-weight:700;margin:0 0 16px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input[type=text]{width:100%;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--bd);border-radius:4px;cursor:pointer;font-weight:700}
.opt input{width:20px;height:20px}.opt.on{border-color:var(--g);background:var(--gl)}.opt.no.on{border-color:var(--p);background:var(--pl)}.opt.ab.on{border-color:var(--i);background:var(--il)}
.row{display:flex;gap:10px;margin-top:24px}
button{flex:1;padding:14px;font:inherit;font-weight:700;border-radius:4px;border:2px solid var(--g);cursor:pointer}
.pri{background:var(--g);color:#fff}.sec{background:transparent;color:var(--g)}button:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--p);font-size:14px;margin-top:12px;min-height:20px}.sum{font-size:15px}.sum b{color:var(--g)}
.done{text-align:center;padding:24px 0}.done .ck{font-size:48px}
</style></head><body><div class="w">
<h1>IVF 간사 규정집 개정안 투표</h1>
<div class="card" id="c"></div><p id="ad" style="text-align:center;margin-top:16px"><a href="#" id="al" style="color:var(--mu);font-size:13px">관리자</a></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const AG=[
{t:"안건 1. 제3차 임기 신설",d:"제14조·제15조·제43조 개정"},
{t:"안건 2. 출산전후휴가 중 연수 기간 변경",d:"별칙 제6호 제13조 신설"}];
const OP=[["찬성","yes"],["반대","no"],["기권","ab"]];
const S={step:0,region:"",name:"",v:[null,null],err:"",busy:false};
const c=document.getElementById("c");
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function hash(s){let h=5381;for(const ch of s)h=((h<<5)+h+ch.codePointAt(0))>>>0;return"v"+h.toString(36)}
function render(){
 if(S.step===0){
  c.innerHTML=`<div class="step">1 / 4 · 투표자 정보</div><p class="q">소속 지방회와 이름을 입력해 주세요.</p>
  <label for="r">소속 지방회</label><input type="text" id="r" value="${esc(S.region)}" autocomplete="off">
  <label for="n">이름</label><input type="text" id="n" value="${esc(S.name)}" autocomplete="off">
  <div class="err">${S.err}</div><div class="row"><button class="pri" id="nx">다음</button></div>`;
  document.getElementById("nx").onclick=()=>{S.region=document.getElementById("r").value.trim();S.name=document.getElementById("n").value.trim();
   if(!S.region||!S.name){S.err="소속 지방회와 이름을 모두 입력해 주세요.";render();return}S.err="";S.step=1;render()}
 }else if(S.step<=2){
  const i=S.step-1,a=AG[i];
  c.innerHTML=`<div class="step">${S.step+1} / 4 · ${a.t.split(".")[0]}</div><p class="q">${a.t}<br><span style="font-size:14px;font-weight:400;color:var(--mu)">${a.d}</span></p>
  <p style="font-size:14px;color:var(--mu);margin:0 0 14px">위 안건에 대한 의견을 선택해 주세요.</p>
  <div class="opts">${OP.map(([l,k])=>`<label class="opt ${k} ${S.v[i]===l?"on":""}" style="margin:0"><input type="radio" name="o" value="${l}" ${S.v[i]===l?"checked":""}>${l}</label>`).join("")}</div>
  <div class="row"><button class="sec" id="pv">이전</button><button class="pri" id="nx" ${S.v[i]?"":"disabled"}>${S.step===2?"확인":"다음"}</button></div>`;
  c.querySelectorAll("input[name=o]").forEach(x=>x.onchange=()=>{S.v[i]=x.value;render()});
  document.getElementById("pv").onclick=()=>{S.step--;render()};
  document.getElementById("nx").onclick=()=>{S.step++;render()};
 }else if(S.step===3){
  c.innerHTML=`<div class="step">4 / 4 · 제출 확인</div><p class="q">투표 내용을 확인해 주세요.</p>
  <div class="sum"><p><b>소속 지방회</b> ${esc(S.region)}<br><b>이름</b> ${esc(S.name)}</p>${AG.map((a,i)=>`<p><b>${a.t}</b><br>${S.v[i]}</p>`).join("")}</div>
  <div class="err">${S.err}</div><div class="row"><button class="sec" id="pv">이전</button><button class="pri" id="sb" ${S.busy?"disabled":""}>투표 제출하기</button></div>`;
  document.getElementById("pv").onclick=()=>{S.step=2;render()};
  document.getElementById("sb").onclick=submit;
 }else{
  c.innerHTML=`<div class="done"><div class="ck">✅</div><p class="q">투표가 제출되었습니다.<br>참여해 주셔서 감사합니다.</p></div>`;
 }
}
async function submit(){
 S.busy=true;S.err="";render();
 try{
  const r=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({region:S.region,name:S.name,a1:S.v[0],a2:S.v[1]})});
  if(r.status===409){S.err="같은 소속 지방회·이름으로 이미 투표가 제출되었습니다.";S.step=3}
  else if(!r.ok)throw new Error("fail");
  else{try{localStorage.setItem("voted","1")}catch(e){}S.step=4}
 }catch(e){S.err="제출하지 못했습니다. 잠시 후 다시 시도해 주세요."}
 S.busy=false;render();
}
async function admin(){
 const key=prompt("관리자 비밀번호");if(!key)return;
 c.innerHTML='<div class="step">관리자</div><p class="q">투표 QR 코드와 결과표</p><div id="qr" style="display:flex;justify-content:center;padding:16px;background:#fff"></div><p style="font-size:13px;color:var(--mu);word-break:break-all;text-align:center">'+location.origin+'/</p><div id="rs">결과를 불러오는 중…</div><div class="row"><button class="sec" id="bk">투표 화면으로</button></div>';
 try{new QRCode(document.getElementById("qr"),{text:location.origin+"/",width:240,height:240})}catch(e){}
 document.getElementById("bk").onclick=()=>{S.step=0;render()};
 const rs=document.getElementById("rs");
 try{
  const r=await fetch("/api/results?key="+encodeURIComponent(key));
  if(!r.ok){rs.textContent="비밀번호가 올바르지 않습니다.";return}
  const rows=(await r.json()).sort((a,b)=>a.at-b.at);
  const th="padding:8px;border:1px solid var(--bd);text-align:center";
  const cnt=(k,l)=>rows.filter(x=>x[k]===l).length;
  rs.innerHTML='<p class="q" style="margin-top:20px">결과표 (총 '+rows.length+'명 참여)</p><table style="width:100%;border-collapse:collapse;font-size:15px"><tr style="background:var(--gl)"><th style="'+th+'">안건</th><th style="'+th+'">찬성</th><th style="'+th+'">반대</th><th style="'+th+'">기권</th></tr>'+AG.map((a,i)=>'<tr><td style="'+th+'">'+a.t.split(".")[0]+'</td>'+OP.map(([l])=>'<td style="'+th+'">'+cnt("a"+(i+1),l)+'</td>').join("")+'</tr>').join("")+'</table><p class="q" style="margin-top:20px">투표자 명단</p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:var(--gl)"><th style="'+th+'">소속 지방회</th><th style="'+th+'">이름</th><th style="'+th+'">안건 1</th><th style="'+th+'">안건 2</th></tr>'+rows.map(x=>'<tr><td style="'+th+'">'+esc(x.region)+'</td><td style="'+th+'">'+esc(x.name)+'</td><td style="'+th+'">'+x.a1+'</td><td style="'+th+'">'+x.a2+'</td></tr>').join("")+'</table>';
 }catch(e){rs.textContent="결과를 불러오지 못했습니다."}
}
document.getElementById("al").onclick=e=>{e.preventDefault();admin()};
try{if(localStorage.getItem("voted"))S.step=4}catch(e){}
render();
</script></body></html>
